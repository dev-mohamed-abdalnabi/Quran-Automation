name: Daily Quran Auto

on:
  schedule:
    # السكربت يشتغل في الدقيقة 15، من الساعة 10 صباحاً لـ 3 العصر (بتوقيت جرينتش)
    # ده بيعادل من 12 الظهر لـ 5 العصر بتوقيت مصر الشتوي (UTC+2) -> 6 محاولات يومياً
    - cron: '15 10-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quran-auto
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Libraries
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3 Pillow==9.5.0 arabic-reshaper python-bidi requests numpy google-api-python-client google-auth-oauthlib scipy

      - name: Run Bot
        env:
          TOKEN_BASE64: ${{ secrets.TOKEN_BASE64 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      - name: Commit daily log if updated
        if: success()
        run: |
          if git status --porcelain | grep daily_log.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily_log.txt
            git commit -m "Update daily upload log [skip ci]"
            git push
          else
            echo "No log changes to commit"
          fi
          
