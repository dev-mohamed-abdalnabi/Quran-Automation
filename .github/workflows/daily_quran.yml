name: Daily Quran Auto

on:
  schedule:
    # التوقيت: يبدأ الساعة 15:17 UTC (يعني 5:17 م بتوقيت مصر)
    # ويكرر المحاولة في الدقيقة 17 و 32 و 47 من كل ساعة
    # بداية من الساعة 15 (3 عصراً UTC) لحد 23 (11 مساءً UTC)
    - cron: '17,32,47 15-23 * * *'
  workflow_dispatch:

# صلاحيات الكتابة عشان يقدر يحفظ ملف الـ Log
permissions:
  contents: write

concurrency:
  group: daily-quran-auto
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: true # مهم عشان يقدر يعمل Push تاني

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Libraries
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3 Pillow==9.5.0 arabic-reshaper python-bidi requests numpy google-api-python-client google-auth-oauthlib

      - name: Run Bot
        env:
          TOKEN_BASE64: ${{ secrets.TOKEN_BASE64 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      # الخطوة دي هي اللي بتحفظ إن الفيديو اترفع عشان ميتكررش
      - name: Commit daily log if updated
        if: success() # تشتغل بس لو السكريبت نجح
        run: |
          if git status --porcelain | grep daily_log.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily_log.txt
            git commit -m "Update daily upload log [skip ci]"
            git push
          else
            echo "No log changes to commit"
          fi
