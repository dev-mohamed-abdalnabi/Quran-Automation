name: Daily Quran Auto

on:
  schedule:
    # يعمل يومياً الساعة 7 صباحاً بتوقيت مصر (5 فجراً بتوقيت جرينتش)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quran-auto
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # تم التحديث من v3 لـ v4 لدعم Node.js الحديثة
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5 # تم التحديث من v4 لـ v5 لدعم Node.js 20/24
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev

      - name: Install Libraries
        run: |
          pip install --upgrade pip
          # ملاحظة: شلنا arabic-reshaper و bidi بناءً على تعليقك في الكود الأصلي
          pip install moviepy==1.0.3 Pillow==9.5.0 requests numpy==1.26.4 google-api-python-client google-auth-oauthlib scipy imageio-ffmpeg proglog

      - name: Run Bot
        env:
          TOKEN_BASE64: ${{ secrets.TOKEN_BASE64 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      - name: Commit daily log if updated
        if: success()
        run: |
          if git status --porcelain | grep daily_log.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily_log.txt
            git commit -m "Update daily upload log [skip ci]"
            git push
          else
            echo "No log changes to commit"
          fi
          
