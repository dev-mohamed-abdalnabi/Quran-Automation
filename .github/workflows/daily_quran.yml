name: Daily Quran Auto

on:
  schedule:
    # 12:00 UTC = 2:00 PM بتوقيت مصر
    # خليناها 11:55 عشان نتجنب زحمة السيرفرات ونضمن يبدأ 2:00
    - cron: '55 11 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Libraries
      run: |
        pip install --upgrade pip
        pip install moviepy==1.0.3 Pillow==9.5.0 arabic-reshaper python-bidi requests numpy google-api-python-client google-auth-oauthlib

    - name: Run Script
      env:
        TOKEN_BASE64: ${{ secrets.TOKEN_BASE64 }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: python main.py
