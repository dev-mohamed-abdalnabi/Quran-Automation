name: Daily Quran Auto

on:
  schedule:
    - cron: '*/15 * * * *'   # كل 15 دقيقة
  workflow_dispatch:

# يمنع تشغيل أكتر من Run في نفس الوقت
concurrency:
  group: daily-quran-auto
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Libraries
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3 Pillow==9.5.0 arabic-reshaper python-bidi requests numpy google-api-python-client google-auth-oauthlib

      - name: Run Bot
        env:
          TOKEN_BASE64: ${{ secrets.TOKEN_BASE64 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      - name: Commit daily log if updated
        run: |
          if git status --porcelain | grep daily_log.txt; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add daily_log.txt
            git commit -m "Update daily upload log"
            git push
          else
            echo "No log changes to commit"
          fi
