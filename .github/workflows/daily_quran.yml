name: Daily Quran Auto

on:
  schedule:
    # 03:00 UTC = 5:00 AM بتوقيت مصر (موعد الفجر)
    - cron: '0 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [start_bot]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # إذا فشل السيرفر، يحاول مرة تانية تلقائياً
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Cache Pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install Libraries
      run: |
        pip install --upgrade pip
        pip install moviepy==1.0.3 Pillow==9.5.0 arabic-reshaper python-bidi requests numpy google-api-python-client google-auth-oauthlib

    - name: Run Script
      env:
        TOKEN_BASE64: ${{ secrets.TOKEN_BASE64 }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      # إضافة محاولة إعادة التشغيل في حالة الخطأ (Retry 3 times)
      run: |
        for i in {1..3}; do
          python main.py && break || sleep 60;
        done
